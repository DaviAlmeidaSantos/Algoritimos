<html lang="pt-BR">

<head>

    <title>conta de luz</title>
</head>

<body>
    Quanto KWh de energia você gasta por mês? <br><input type="text" id="ipt_preco"><br>
    <button onclick="pagar()">Calcular conta de luz</button><br>

    <div id="div_msg"></div>
</body>
<script>
    function pagar() {
        let preco = Number(ipt_preco.value);
        if (preco >= 20) {
            let resultado = preco - preco / 10;
            alert("você vai pagar R$ " + {resultado});
        } else {
            alert("você vai pagar R$ " + {preco})
        }
    }

</script>

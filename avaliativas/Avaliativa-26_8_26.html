<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Corridas de Táxi</title>
</head>

<body>
    Distância percorrida (KM): <br>
    <input type="text" id="ipt_kms"><br><br>

    Velocidade média do carro (KM/h): <br>
    <input type="text" id="ipt_velocidade"><br><br>

    <button onclick="rodar()">Simular</button><br><br>

    <div id="div_msg"></div>
</body>

<script>
    let cbt = 25;

    function rodar() {
        let kms = Number(ipt_kms.value);
        let vel = Number(ipt_velocidade.value);
        let tmp = kms / vel;
        let cbg = kms / 10;
        let cgp = (cbg / 25) * 100;
        let cbr = cbt - cbg;
        let crp = (cbr / 25) * 100; 
        
        cbt = cbr;
        let mensagem = `Ao percorrer ${kms} km, em velocidade média de ${vel} km/h, a viagem durou ${tmp} horas. ` +
                       `Ao todo, foram gastos ${cbg} litros de combustível (${cgp}%). ` +
                       `Restam ${cbr} litros de combustível (${crp}%).<br>`;
        if (cbt >= 7.5) {
            mensagem += "Continue a rodar!";
        } else {
            mensagem += "É melhor parar para reabastecer!";
        }

        div_msg.innerHTML = mensagem;
    }
</script>

</html>

<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 7 de JS</title>
</head>

<body>
    Diga o nome do seu PET: <input id="ipt_nome"> <br>
    Diga qual animal ele é: <input id="ipt_especie"> <br>
    <button onclick="oaranamed">Identificar PET</button>
</body>

<script>
    function oaranamed() {
        alert("O seu pet se chama " + ipt_nome.value + "e ele é um: " + ipt_especie.value);
    }
</script>

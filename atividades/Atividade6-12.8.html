<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10 de JS</title>
</head>

<body>
    Diga a sua Distância Percorrida em KMs: <input id="ipt_dis"> <br>
    Diga em quantos minutos você fez: <input id="ipt_Tempo"> <br>
    <button onclick="oaranamed">Finalizar treino</button>
</body>

<script>
    function oaranamed() {
        alert("Você percorreu" + ipt_dis.value + " km hoje!")
        alert("Seu tempo total de exercicio foi de: " + ipt_Tempo.value);
    }
</script>

</html>

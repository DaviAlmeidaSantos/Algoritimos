<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2 de JS</title>
</head>

<body>
    Nome do Time: <input id="ipt_Time"> <br>
    Quantidade de Títulos: <input id="ipt_titulos"> <br>
    <button onclick="oaranamed">Amo meu time</button>
</body>

<script>
    function oaranamed() {
        alert("O time " + ipt_Time.value + " tem " + ipt_titulos.value + " titulos");
    }
</script>

</html>

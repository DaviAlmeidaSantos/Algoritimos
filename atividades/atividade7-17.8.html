<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner HTML</title>
</head>

<body>
    Insira sua nota: <input id="ipt_Nota"> <br>
    <button onclick="Mae">Mostrar opnião da mãe</button>
    <button onclick="vo">Mostrar opnião da vo</button>
    <div id="div_exibir"></div>
</body>



</html>
<script>
    function Mae() {
        div_exibir.innerHTML = "Não fez mais que tua obrigação com essa nota" + ipt_Nota.value
    }
    function vo() {
        // alert("Muito bem, que neto inteligente, porque tirou" + ipt_Nota.value);
        div_exibir.innerHTML = "Muito bem, que neto inteligente, porque tirou" + ipt_Nota.value
    }
</script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="ipt_1" />
    <input type="text" id="ipt_2" />
    <button onclick="multiplicar">*</button>
    <button onclick="dividir">/</button>
    <button onclick="sub">-</button>
    <button onclick="soma">+</button>
    <div id="div_exibir"></div>
</body>
<script>
    function multiplicar() {
        div_exibir.innerHTML = "O resultado da multiplicação é: " + ipt_1.value * ipt_2.value
    }
    function dividir() {
        div_exibir.innerHTML = "O resultado da divisão é: " + ipt_1.value / ipt_2.value
    }
    function sub() {
        div_exibir.innerHTML = "O resultado da subtração é: " + (ipt_1.value - ipt_2.value)
    }
    function soma() {
        div_exibir.innerHTML = "O resultado da soma é: "(Number + (ipt_1.value + ipt_2.value))
    }
</script>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP</title>
</head>

<body>
    qual o valor da passagem <br><input type="text" id="ipt_passagem" /><br>
    contando ida e volta, quantas viagens se faz por mês? <br><input type="text" id="ipt_viagem" /><br>
    qual A distancia de sua casa ao trabalho em KMs <br><input type="text" id="ipt_distancia" /><br>
    <button onclick="VT()">Calcular VT</button><br>

    <div id="div_exibir"></div>
</body>
<script>
    function VT() {
        let passagem = Number(ipt_n1.value);
        let viagem = Number(ipt_n2.value);
        let distancia = Number(ipt_n3.value);
        let resultado = ((viagen / 10) * distancia * 0.75) + (viagem - viagem / 10) * passagem;
        div_exibir.innerHTML = `você vai gastar  R$${resultado} por mês com transporte`;
    }
</script>

</html>

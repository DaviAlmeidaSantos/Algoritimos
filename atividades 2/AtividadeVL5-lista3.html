<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fases do Sono</title>
</head>

<body>
    Quantas horas você dormiu: <input type="text" id="ipt_horas"><br>
    <button onclick="calcularSono()">Calcular Sono</button><br>

    <div id="div_exibir"></div>
</body>

<script>
    function calcularSono() {
        let horas = Number(ipt_horas.value);

        let fase1 = horas * 0.05;
        let fase2 = horas * 0.45;
        let fase3 = horas * 0.30;
        let rem = horas * 0.20;

        div_exibir.innerHTML = `
            Ao dormir ${horas} horas, você dormiu:<br><br>
            ${fase1.toFixed(2)} horas na fase 1<br>
            ${fase2.toFixed(2)} horas na fase 2<br>
            ${fase3.toFixed(2)} horas na fase 3<br>
            ${rem.toFixed(2)} horas na fase REM
        `;
    }
</script>
</html>

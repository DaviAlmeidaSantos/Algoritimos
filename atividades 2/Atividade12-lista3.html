<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pizzzzzzzzzza</title>
</head>

<body>
    qual o sabor da pizza<br><input type="text" id="ipt_sabor"><br>
    Quantas pessoas vão pagar <br><input type="text" id="ipt_n1"><br>
    Quanto custa a pizza <br><input type="text" id="ipt_n2"><br>
    <button onclick="pagar()">Ver valor por amigo</button><br>

    <div id="div_exibir"></div>

    <script>
        function pagar() {
            let n1 = Number(ipt_n1.value);
            let n2 = Number(ipt_n2.value);
            let resultado = n2 / (n1 * 1.1);
            div_exibir.innerHTML = `  Cada amigo vai colaborar com R$ ${resultado} para a pizza de ${ipt_sabor.value}.`;
        }
    </script>

</body>

</html>

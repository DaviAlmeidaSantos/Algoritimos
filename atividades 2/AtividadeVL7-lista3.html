<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pizzzzzzzzzza</title>
</head>

<body>
    qual o sabor da pizza<br><input type="text" id="ipt_sabor"><br>
    Quantas pessoas vão pagar <br><input type="text" id="ipt_pessoas"><br>
    Quanto custa a pizza <br><input type="text" id="ipt_preco"><br>
    <button onclick="pagar()">Ver valor por amigo</button><br>

    <div id="div_exibir"></div>
</body>
<script>
        function pagar() {
            let pessoas = Number(ipt_pessoas.value);
            let preco = Number(ipt_preco.value);
            let resultado = pessoas / (preco * 1.1);
            div_exibir.innerHTML = `  Cada amigo vai colaborar com R$ ${resultado} para a pizza de ${ipt_sabor.value}.`;
        }
    </script>

</html>
